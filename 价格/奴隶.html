<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>九柱神的奴隶</title>
    <style>
:root {
    --bg:#f4f6fa;
    --panel:#fff;
    --text:#1e293b;
    --muted:#64748b;
    --line:#e2e8f0;
    --accent:#3859c7;
    --accent2:#e8edff;
    --danger:#b42318;
    --good:#087f5b;
}
/* Chrome、Edge、Safari */
::-webkit-scrollbar {
  display: none;
}

/* Firefox */
* {
  scrollbar-width: none;
}

/* IE、旧版 Edge */
* {
  -ms-overflow-style: none;
}
* {
    box-sizing:border-box
}
body {
    margin:0;
    background:var(--bg);
    font:15px/1.5 system-ui,-apple-system,"Segoe UI","Noto Sans TC",sans-serif;
    color:var(--text)
}
.wrap {
    max-width:1660px;
    margin:auto;
    padding:28px 18px 50px
}
.head {
    grid-column:1;
    grid-row:1;
    display:flex;
    justify-content:flex-start;
    align-items:flex-start;
    gap:16px;
    margin:0;
    padding:0 0 8px;
}
.eyebrow {
    font-size:12px;
    letter-spacing:.12em;
    color:var(--muted);
    font-weight:700
}
.head h1 {
    margin:4px 0 0;
    font-size:clamp(24px,4vw,34px)
}
.head > div { min-width:0; }
.head p {
    margin:5px 0 0;
    color:var(--muted)
}
.pill {
    border:1px solid var(--line);
    background:#fff;
    border-radius:999px;
    padding:8px 12px;
    font-size:12px;
    color:var(--muted);
    white-space:nowrap
}
.layout {
    display:grid;
    position:relative;
    grid-template-columns:230px minmax(0,1fr) 380px;
    gap:18px;
    align-items:start
}
.layout > .head { position:absolute; top:0; left:0; width:250px; }
.layout > .eventnav { grid-column:1; grid-row:1; margin-top:132px; }
.layout > section:not(.summary) { grid-column:2; grid-row:1; }
.layout > .summary { grid-column:3; grid-row:1; }
.eventnav {
    position:sticky;
    top:16px
}
.event-list {
    display:grid;
    gap:8px
}
.event-btn {
    display:block;
    width:100%;
    text-align:left;
    background:#fff;
    border:1px solid var(--line);
    color:var(--text);
    padding:12px;
    border-radius:12px
}
.event-btn.active {
    background:var(--accent2);
    border-color:#aebfff;
    color:var(--accent)
}
.event-btn strong {
    display:block;
    font-size:14px
}
.event-btn span {
    display:block;
    font-size:12px;
    color:var(--muted);
    margin-top:3px
}
.event-note {
    font-size:12px;
    color:var(--muted);
    margin:12px 0 0
}
.panel {
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:18px;
    padding:20px;
    box-shadow:0 4px 18px #0f172a08
}
.panel h2 {
    font-size:17px;
    margin:0 0 16px
}
.section-head {
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;
    margin-bottom:14px
}
.section-head h2 {
    margin:0
}
button {
    font:inherit;
    border:0;
    border-radius:10px;
    padding:10px 14px;
    cursor:pointer;
    font-weight:650
}
.primary {
    background:var(--accent);
    color:white
}
.soft {
    background:var(--accent2);
    color:var(--accent)
}
.ghost {
    background:#fff;
    border:1px solid var(--line);
    color:var(--text)
}
.small {
    font-size:13px;
    padding:7px 10px
}
.items {
    display: grid;
    gap: 12px;
}


.item {
    border:1px solid var(--line);
    border-radius:14px;
    padding:14px
}
.itemtop {
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:10px
}
.itemtitle {
    font-weight:700
}
.fields {
    display:grid;
    grid-template-columns:minmax(140px,1.5fr) minmax(90px,.8fr) minmax(80px,.65fr);
    gap:10px
}
.field {
    display:flex;
    flex-direction:column;
    gap:5px
}
.field label {
    font-size:12px;
    color:var(--muted)
}
input,textarea,select {
    width:100%;
    font:inherit;
    color:var(--text);
    border:1px solid #cbd5e1;
    border-radius:9px;
    background:white;
    padding:10px;
    min-width:0
}
.line-total {
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:12px;
    padding-top:10px;
    border-top:1px dashed var(--line);
    font-size:13px;
    color:var(--muted)
}
.line-total strong {
    font-size:16px;
    color:var(--text)
}
.summary {
    position:sticky;
    top:16px
}
.totalbox {
    background:linear-gradient(135deg,#eef2ff,#f8faff);
    border:1px solid #dbe4ff;
    border-radius:14px;
    padding:18px;
    margin-bottom:18px
}
.bonus-box {
    border:1px solid var(--line);
    border-radius:12px;
    padding:14px;
    margin:0 0 18px;
    background:#fff;
}
.bonus-box h2 { margin:0 0 12px; }
.bonus-results { display:grid; gap:10px; }
.bonus-row { display:flex; justify-content:space-between; align-items:flex-start; gap:12px; font-size:13px; }
.bonus-row span { color:var(--muted); }
.bonus-row strong { color:var(--text); text-align:right; white-space:nowrap; }
.bonus-note { font-size:12px; color:var(--muted); margin:10px 0 0; line-height:1.5; }
.total-label {
    color:#53618a;
    font-size:13px
}
.total {
    font-size:clamp(28px,4vw,36px);
    font-weight:800;
    letter-spacing:-.03em;
    margin:3px 0 10px
}
.rows {
    display:grid;
    gap:10px
}
.sumrow {
    display:flex;
    justify-content:space-between;
    gap:12px;
    color:var(--muted);
    font-size:14px
}
.sumrow strong {
    color:var(--text);
    font-weight:650;
    font-variant-numeric:tabular-nums
}
.rule {
    height:1px;
    background:var(--line);
    margin:15px 0
}
.extras {
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px
}
.hint {
    font-size:12px;
    color:var(--muted);
    margin:14px 0 0
}
.bar {
    height:7px;
    background:#e2e8f0;
    border-radius:999px;
    overflow:hidden;
    margin:9px 0
}
.bar span {
    display:block;
    height:100%;
    width:0;
    background:var(--good)
}
.status {
    font-size:13px;
    color:var(--muted)
}
.status.over {
    color:var(--danger)
}
.product-demo {
    display:grid;
    grid-template-columns:88px minmax(0,1fr);
    gap:12px;
    align-items:center
}
.demo-img {
    width:88px;
    height:88px;
    border:1px solid var(--line);
    border-radius:12px;
    background:#f7f8fc;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden
}
.demo-img img {
    width:100%;
    height:100%;
    object-fit:contain
}
.demo-img svg {
    width:78px;
    height:78px
}
.demo-name {
    font-weight:750
}
.demo-price {
    font-size:18px;
    font-weight:800;
    margin-top:4px
}
.demo-meta {
    font-size:12px;
    color:var(--muted)
}
.demo-qty {
    display:flex;
    align-items:center;
    gap:8px;
    margin-top:9px
}
.demo-qty input {
    width:80px;
    padding:7px;
    text-align:center
}
.filter {
    display:flex;
    gap:8px;
    margin-bottom:14px;
    align-items:center
}
.filter input {
    flex:7 1 0;
    width:0;
    min-width:0
}
.filter select {
    flex:3 1 0;
    width:0;
    min-width:0
}
.productgrid {
    display:block
}
.category-group {
    margin: 0 0 20px;
    container-type: inline-size;
}
.category-heading {
    display:flex;
    align-items:center;
    justify-content:center;
    gap:12px;
    margin: 30px 0 30px;
    color:#243247;
    font-size:18px;
    font-weight:800;
}
.category-heading::before,
.category-heading::after {
    content:"";
    height:1px;
    background:var(--line);
    flex:1;
}
.category-items {
    display:grid;
    grid-template-columns:repeat(4,minmax(0,1fr));
    justify-content:stretch;
    gap:10px;
}
/* 电脑版默认四列；只有实际容器宽度不足时才逐级减少列数 */
@container (max-width: 645px) {
  .category-items { grid-template-columns:repeat(3,minmax(0,1fr)); }
}
@container (max-width: 481px) {
  .category-items { grid-template-columns:repeat(2,minmax(0,1fr)); }
}
@container (max-width: 317px) {
  .category-items { grid-template-columns:minmax(0,1fr); }
}
.productcard {
    border:1px solid var(--line);
    border-radius:12px;
    overflow:hidden
}
.productcard .art {
    height:112px;
    background:#f8f9fc;
    display:flex;
    align-items:center;
    justify-content:center
}
.productcard .art img {
    width:100%;
    height:100%;
    object-fit:contain
}
.productcard .art svg {
    width:95px;
    height:95px
}
.productcard .details {
    padding:10px
}
.productcard .details strong {
    display:block;
    font-size:13px;
    line-height:1.5
}
.productcard .details .product-name {
    margin:0
}
.productcard .details .product-unit-total {
    margin:0 0 8px;
    font-size:13px;
    line-height:1.5;
    font-weight:700;
    color:var(--text)
}
.productcard .details span {
    display:block;
    font-size:12px;
    color:var(--muted);
    margin-top:3px
}
.productcard .details input {
    margin-top:8px;
    padding:7px;
    text-align:center
}

.product-info-row {
    display:flex;
    align-items:center;
    gap:8px;
    margin-top:8px
}
.product-info-row input {
    flex:0 0 52px;
    width:52px;
    max-width:52px;
    margin-top:0;
    padding:6px 2px;
    text-align:center
}
.product-prices {
    flex:1 1 auto;
    min-width:0
}
.product-prices span {
    display:block;
    margin-top:3px
}

@media(max-width:1050px) {
    .layout {
    grid-template-columns:190px minmax(0,1fr)
}
.layout > .head { width:205px; }
.layout > .eventnav { grid-column:1; grid-row:1; margin-top:132px; }
.layout > section:not(.summary) { grid-column:2; grid-row:1; }
.summary {
    grid-column:2;
    grid-row:2;
    position:static
}
}
@media(max-width:1200px) {
    .layout {
    grid-template-columns:1fr
}
.layout > .head { position:static; width:auto; }
.layout > .head, .layout > .eventnav, .layout > section:not(.summary), .layout > .summary {
    grid-column:1;
    grid-row:auto;
}
.layout > .eventnav { margin-top:0; }
.eventnav {
    position:static
}
.event-list {
    grid-template-columns:repeat(auto-fit,minmax(140px,1fr))
}
.summary {
    grid-column:auto
}
.summary {
    position:static
}
.head {
    align-items:flex-start;
    flex-direction:column
}
.fields {
    grid-template-columns:1fr 1fr
}
.fields .namefield {
    grid-column:1/-1
}
}
@media(max-width:520px) {
    .panel {
    padding:15px
}
.wrap {
    padding:18px 12px 35px
}
.extras {
    grid-template-columns:1fr 1fr
}
.category-items {
    grid-template-columns:repeat(auto-fill, 154px)
}
}
 .collapse-toggle { display:flex; width:100%; align-items:center; justify-content:space-between; padding:0; border:0; background:transparent; color:inherit; font:inherit; font-weight:inherit; cursor:pointer; text-align:left; }
.collapse-toggle span { font-size:20px; line-height:1; color:var(--muted, #64748b); }
#extraFields.is-collapsed, #amountRows.is-collapsed, #budgetFields.is-collapsed { display:none; }

.batch-open { flex: 0 0 auto; white-space: nowrap; padding: 10px 13px; background: var(--accent2); color: var(--accent); border: 0; border-radius: 9px; font-weight: 700; cursor: pointer; }
.batch-overlay { position: fixed; inset: 0; z-index: 30; background: rgba(20,25,40,.42); display: flex; align-items: center; justify-content: center; padding: 18px; }
.batch-overlay[hidden] { display: none !important; }
.batch-dialog { width: min(460px, 100%); max-height: min(80vh, 700px); overflow: auto; background: white; color: #202438; border-radius: 16px; padding: 22px; box-shadow: 0 18px 60px rgba(0,0,0,.25); }
.batch-title-row { display:flex; align-items:center; justify-content:space-between; gap:12px; }
.batch-title-row h2 { margin:0; font-size:20px; }
.batch-close { border:0; background:transparent; font-size:26px; cursor:pointer; color:#666; }
.batch-dialog p { color:#6c7180; font-size:13px; }
.batch-categories { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; margin:16px 0; }
.batch-categories label { display:grid; grid-template-columns:20px minmax(0,1fr); align-items:center; justify-content:start; gap:10px; min-width:0; min-height:54px; border:1px solid #e0e4ed; border-radius:9px; padding:12px 14px; cursor:pointer; overflow-wrap:anywhere; }
.batch-categories label input[type="checkbox"] { display:block; width:18px; height:18px; margin:0; justify-self:center; }
.batch-categories label span { min-width:0; width:auto; white-space:normal; word-break:keep-all; }
.batch-quantity-row { display:flex; align-items:center; justify-content:space-between; gap:16px; margin:12px 0 6px; }
.batch-quantity-label { display:block; margin:0; font-weight:700; flex:1 1 auto; }
#batchQuantity { flex:0 0 52px; width:52px; max-width:52px; margin-left:auto; box-sizing:border-box; text-align:center; }
.batch-quantity-input-wrap { display:flex; align-items:center; gap:8px; flex:0 0 auto; }
.batch-quantity-unit, .cart-qty-unit { white-space:nowrap; color:var(--muted, #64748b); }
@media (max-width:420px) { .batch-quantity-row { align-items:center; } #batchQuantity { flex-basis:52px; width:52px; } }
.batch-actions { display:flex; justify-content:flex-end; gap:8px; margin-top:18px; }
.batch-actions button { padding:9px 14px; border:1px solid #d8dce6; border-radius:8px; background:white; cursor:pointer; }
.batch-actions .batch-confirm { background:var(--accent2); color:var(--accent); border-color:var(--accent2); }
.batch-actions #cancelBatchAdd { background:#fff; color:var(--text); border-color:var(--line); }
.cart-print-qty { display:none; }
@page { margin: 8mm; }

@media print {
  body { background: white; color: #111; }
  .wrap { max-width: none; padding: 0; }
  .head, .eventnav, .view-switch, #viewProducts,
  .cart-heading p, .summary .field, .summary .bar, .summary .extras,
  #clear, #print, .hint, .budget-status, .budget-heading, .extra-heading, #budgetStatus, #budgetHeadingRule, #extraHeadingRule, #budgetFields, #toggleBudget, #budget, #budgetFill, #budgetStatus + .rule, #extraFields, #toggleExtras, #toggleAmountRows { display: none !important; }
  .layout { display: flex; flex-direction: column; gap: 16px; align-items: stretch; }
  .panel { width: 100%; box-sizing: border-box; box-shadow: none; border: 1px solid #ddd; break-inside: auto; margin: 0; padding: 14px; }
  #viewCart { display: block !important; }
  .summary { position: static; }
  .totalbox, .bonus-box { display: block !important; }
  /* Keep each summary card together when paginating the PDF. The shopping cart remains unchanged. */
  .totalbox, .bonus-box { break-inside: avoid !important; page-break-inside: avoid !important; }
  .summary > h2.amount-heading { break-after: avoid !important; page-break-after: avoid !important; }
  #amountRows { display: block !important; break-inside: avoid !important; page-break-inside: avoid !important; }
  .sumrow { break-inside: avoid; }
  .sumrow.print-zero { display: none !important; }
  .cart-item, .cart-row { break-inside: avoid; }
  .cart-remove, .batch-open, .batch-overlay { display: none !important; }
  .cart-qty, .cart-qty-unit { display: none !important; }
  .cart-print-qty { display: inline !important; font-size: 16px; font-weight: 800; white-space: nowrap; }
  .cart-controls { gap: 0; }
  .status{ display: none !important;  }
  @page { margin: 0; }
}

.view-switch {
  display: flex;
  position: sticky;
  top: 8px;
  z-index: 5;
  gap: 8px;
  margin-bottom: 18px;
  padding: 4px;
  border-radius: 12px;
  background: var(--soft, #f1f5f9);
}
.view-tab {
  flex: 1;
  border: 0;
  border-radius: 9px;
  padding: 11px 14px;
  background: transparent;
  color: var(--muted, #64748b);
  font: inherit;
  font-weight: 700;
  cursor: pointer;
}
.view-tab.active {
  background: var(--surface, #fff);
  color: var(--text, #172033);
  box-shadow: 0 1px 4px rgba(15, 23, 42, .10);
}
#cartBadge {
  display: inline-flex;
  min-width: 22px;
  height: 22px;
  align-items: center;
  justify-content: center;
  margin-left: 5px;
  border-radius: 999px;
  background: #087f5b;
  color: #fff;
  font-size: 12px;
}
.cart-heading h2 { margin: 0 0 5px; }
.cart-heading p { margin: 0 0 16px; color: var(--muted, #64748b); }
.cart-items { display: grid; gap: 10px; }
.cart-row {
  display: grid;
  grid-template-columns: 64px minmax(0, 1fr) auto;
  align-items: center;
  gap: 12px;
  padding: 12px;
  border: 1px solid var(--line, #dce4f0);
  border-radius: 14px;
  background: var(--surface, #fff);
}
.cart-thumb {
  width: 64px;
  height: 64px;
  object-fit: cover;
  border-radius: 10px;
  background: #f1f5f9;
}
.cart-info { min-width: 0; display: grid; gap: 4px; }
.cart-name { font-weight: 700; overflow-wrap: anywhere; }
.cart-meta { color: var(--muted, #64748b); font-size: 13px; }
.cart-controls { display: flex; align-items: center; gap: 6px; margin-top: 4px; }
.cart-qty {
  width: 52px;
  max-width: 52px;
  text-align: center;
  padding: 5px 7px;
  border: 1px solid var(--line, #cbd5e1);
  border-radius: 8px;
  font: inherit;
}
.cart-price { text-align: right; font-weight: 800; white-space: nowrap; }
.cart-remove {
  border: 0;
  background: transparent;
  color: #b42318;
  cursor: pointer;
  padding: 4px;
  font: inherit;
  font-size: 13px;
}
.cart-empty { padding: 30px 12px; text-align: center; color: var(--muted, #64748b); }
@media (max-width: 620px) {
  .cart-row { grid-template-columns: 48px minmax(0, 1fr); }
  .cart-thumb { width: 48px; height: 48px; }
  .cart-price { grid-column: 2; text-align: left; }
}


[hidden] { display: none !important; }

.add-to-cart {
  width: 100%;
  margin-top: 8px;
  border: 0;
  border-radius: 9px;
  padding: 10px 12px;
  background: #087f5b;
  color: #fff;
  font: inherit;
  font-weight: 700;
  cursor: pointer;
  transition: filter 0.3s ease;
}
.add-to-cart:hover { filter: brightness(.8); }


.eventnav-toggle {
  display:flex; width:100%; align-items:center; justify-content:space-between;
  padding:0; margin:0 0 16px; border:0; background:transparent; color:inherit;
  font:inherit; font-size:17px; font-weight:700; text-align:left; cursor:pointer;
}
.eventnav-toggle span { display:none; color:var(--muted); font-size:20px; line-height:1; }
@media (max-width:1200px) {
  .eventnav-toggle span { display:inline; }
  .eventnav-content.is-collapsed { display:none; }
  .eventnav { position:static; }
}


/* Responsive layout fix: keep the activity directory below the title on narrow screens,
   and never shrink product cards below the desktop card width. */
@media screen and (max-width: 1200px) {
  .layout {
    display: flex !important;
    flex-direction: column !important;
    align-items: stretch !important;
    gap: 16px !important;
  }
  .layout > .head,
  .layout > .eventnav,
  .layout > section:not(.summary),
  .layout > .summary {
    position: static !important;
    inset: auto !important;
    width: 100% !important;
    max-width: 100% !important;
    box-sizing: border-box !important;
    margin-top: 0 !important;
    grid-column: auto !important;
    grid-row: auto !important;
  }
  .layout > .head { order: 0 !important; }
  .layout > .eventnav { order: 1 !important; }
  .layout > section:not(.summary) { order: 2 !important; min-width: 0 !important; }
  .layout > .summary { order: 3 !important; }
  .category-items {
    grid-template-columns: repeat(4, minmax(0, 1fr)) !important;
    justify-content: stretch !important;
  }
  .productcard { width: auto !important; min-width: 0 !important; box-sizing: border-box !important; }
}
@container (max-width: 645px) {
  .category-items { grid-template-columns: repeat(3, minmax(0, 1fr)) !important; }
}
@container (max-width: 481px) {
  .category-items { grid-template-columns: repeat(2, minmax(0, 1fr)) !important; }
}
@container (max-width: 317px) {
  .category-items { grid-template-columns: minmax(0, 1fr) !important; }

" cy="47" r="3" fill="#555"/><circle cx="70" cy="47" r="3" fill="#555"/><ellipse cx="60" cy="57" rx="6" ry="4" fill="#e6a8c0"/><rect x="39" y="72" width="42" height="27" rx="13" fill="#fff" stroke="#d4a0b7" stroke-width="3"/>'}else{svg+='<path d="M35 48 L35 96 L85 96 L85 48 L75 48 L75 37 Q75 20 60 20 Q45 20 45 37 L45 48" fill="#fff" stroke="#8ba9d7" stroke-width="4" stroke-linejoin="round"/><path d="M49 39 Q49 28 60 28 Q71 28 71 39" fill="none" stroke="#8ba9d7" stroke-width="4"/><path d="M49 64 H71 M49 74 H71" stroke="#8ba9d7" stroke-width="3" stroke-linecap="round"/>'}return svg+'</svg>'}

function render() {
  const host = $('productGrid');
  const query = $('search').value.trim().toLowerCase();
  const category = $('category').value;
  host.innerHTML = '';

  const filtered = PRODUCTS.filter(product =>
    (!category || product.category === category) &&
    [product.name, product.category, product.id].join(' ').toLowerCase().includes(query)
  );

  $('productCount').textContent = filtered.length + ' 件商品';

  if (!filtered.length) {
    host.append(node('div', 'status', '没有符合的商品。'));
    return;
  }

  const groups = new Map();
  filtered.forEach(product => {
    const key = product.category || '其他';
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(product);
  });

  groups.forEach((products, categoryName) => {
    const group = node('section', 'category-group');
    group.append(node('h3', 'category-heading', categoryName));
    const grid = node('div', 'category-items');

    products.forEach(product => {
      const card = node('article', 'productcard');
      const art = node('div', 'art');

      if (product.image) {
        const image = node('img');
        image.src = product.image;
        image.alt = product.name;
        image.onerror = () => { art.innerHTML = artSvg(product); };
        art.append(image);
      } else {
        art.innerHTML = artSvg(product);
      }

      const details = node('div', 'details');
      const productName = node('strong', 'product-name', product.name);
      const productTotal = node('strong', 'product-unit-total', yen((Number(product.price) || 0) + (Number(product.fee) || 0)));
      details.append(productName, productTotal);

      const infoRow = node('div', 'product-info-row');
      const quantity = node('input');
      quantity.type = 'number';
      quantity.min = '0';
      quantity.step = '1';
      quantity.value = draftQuantities[product.id] ?? 0;
      quantity.setAttribute('aria-label', product.name + '购买数量');
      quantity.oninput = () => {
        draftQuantities[product.id] = Math.max(0, Math.floor(Number(quantity.value) || 0));
      };

      const prices = node('div', 'product-prices');
      prices.append(
        node('span', '', (product.priceLabel ?? '商品') + ' · ' + yen(product.price)),
        node('span', '', '附加费 ' + yen(product.fee || 0))
      );
      infoRow.append(quantity, prices);

      const addButton = node('button', 'add-to-cart', '加入购物清单');
      addButton.type = 'button';
      addButton.onclick = () => {
        const quantityToAdd = Math.max(0, Math.floor(Number(draftQuantities[product.id]) || 0));
        if (quantityToAdd === 0) { quantity.focus(); return; }
        cartQuantities[product.id] = (cartQuantities[product.id] || 0) + quantityToAdd;
        saveEventState();
        renderCart();
        calculate();
        addButton.textContent = '已加入';
        window.setTimeout(() => { addButton.textContent = '加入购物清单'; }, 900);
      };

      details.append(infoRow, addButton);
      card.append(art, details);
      grid.append(card);
    });

    group.append(grid);
    host.append(group);
  });
}

function renderCart() {
  const host = $('cartItems');
  if (!host) return;
  host.innerHTML = '';

  const chosen = PRODUCTS.filter(product => (cartQuantities[product.id] || 0) > 0);
  const count = chosen.reduce((sum, product) => sum + (cartQuantities[product.id] || 0), 0);
  $('cartBadge').textContent = count;

  if (chosen.length === 0) {
    host.innerHTML = '<div class="cart-empty">购物清单还是空的。先到商品目录选择数量吧。</div>';
    return;
  }

  chosen.forEach(product => {
    const quantity = cartQuantities[product.id] || 0;
    const lineTotal = (Number(product.price) + Number(product.fee || 0)) * quantity;
    const row = document.createElement('div');
    row.className = 'cart-row';

    const thumb = document.createElement('img');
    thumb.className = 'cart-thumb';
    thumb.alt = product.name;
    if (product.image) thumb.src = product.image;
    else if (product.art) {
      thumb.src = 'data:image/svg+xml;charset=UTF-8,' + encodeURIComponent(product.art);
    }

    const info = document.createElement('div');
    info.className = 'cart-info';

    const name = document.createElement('div');
    name.className = 'cart-name';
    name.textContent = product.name;

    const meta = document.createElement('div');
    meta.className = 'cart-meta';
    meta.textContent = '单价 ' + yen(product.price) + ' · 单件附加费 ' + yen(product.fee || 0);

    const controls = document.createElement('div');
    controls.className = 'cart-controls';

    const qty = document.createElement('input');
    qty.className = 'cart-qty';
    qty.type = 'number';
    qty.min = '0';
    qty.step = '1';
    qty.value = quantity;
    qty.setAttribute('aria-label', product.name + '数量');
    const qtyUnit = document.createElement('span');
    qtyUnit.className = 'cart-qty-unit';
    qtyUnit.textContent = '件';
    const printQty = document.createElement('span');
    printQty.className = 'cart-print-qty';
    printQty.textContent = quantity + ' 件';
    qty.addEventListener('change', () => {
      const nextQuantity = Math.max(0, Math.floor(Number(qty.value) || 0));
      if (nextQuantity > 0) cartQuantities[product.id] = nextQuantity;
      else delete cartQuantities[product.id];
      saveEventState();
      renderCart();
      calculate();
      render();
    });

    const remove = document.createElement('button');
    remove.type = 'button';
    remove.className = 'cart-remove';
    remove.textContent = '移除';
    remove.addEventListener('click', () => {
      delete cartQuantities[product.id];
      saveEventState();
      renderCart();
      calculate();
      render();
    });

    controls.append(qty, qtyUnit, printQty, remove);
    info.append(name, meta, controls);

    const price = document.createElement('div');
    price.className = 'cart-price';
    price.textContent = '商品费用 ' + yen(lineTotal);

    row.append(thumb, info, price);
    host.append(row);
  });
}

function openBatchModal() {
  const host = $('batchCategories');
  host.innerHTML = '';
  [...new Set(PRODUCTS.map(p => p.category || '其他'))].forEach((category, index) => {
    const label = document.createElement('label');
    const checkbox = document.createElement('input');
    checkbox.type = 'checkbox'; checkbox.value = category; checkbox.name = 'batchCategory';
    checkbox.id = 'batchCategory' + index;
    label.append(checkbox, document.createTextNode(category));
    host.append(label);
  });
  $('batchQuantity').value = '1';
  $('batchModal').hidden = false;
}
function closeBatchModal() { $('batchModal').hidden = true; }
$('openBatchAdd').addEventListener('click', openBatchModal);
$('closeBatchAdd').addEventListener('click', closeBatchModal);
$('cancelBatchAdd').addEventListener('click', closeBatchModal);
$('batchModal').addEventListener('click', e => { if (e.target === $('batchModal')) closeBatchModal(); });
$('confirmBatchAdd').addEventListener('click', () => {
  const selected = [...$('batchCategories').querySelectorAll('input[name="batchCategory"]:checked')].map(el => el.value);
  const quantity = Math.max(0, Math.floor(Number($('batchQuantity').value) || 0));
  if (!selected.length) { alert('请至少勾选一个分类。'); return; }
  if (!quantity) { $('batchQuantity').focus(); return; }
  const matches = PRODUCTS.filter(p => selected.includes(p.category || '其他'));
  matches.forEach(p => { cartQuantities[p.id] = (cartQuantities[p.id] || 0) + quantity; });
  saveEventState(); renderCart(); calculate(); render(); closeBatchModal();
});

function switchView(view) {
  const cartVisible = view === 'cart';
  $('viewProducts').hidden = cartVisible;
  $('viewProducts').style.display = cartVisible ? 'none' : 'block';
  $('viewCart').hidden = !cartVisible;
  $('viewCart').style.display = cartVisible ? 'block' : 'none';
  $('showProducts').classList.toggle('active', !cartVisible);
  $('showCart').classList.toggle('active', cartVisible);
  if (cartVisible) renderCart();
}

function renderBonuses() {
  const box = $('bonusBox');
  const results = $('bonusResults');
  if (!box || !results) return;

  const addRow = (label, value) => {
    const row = node('div', 'bonus-row');
    row.append(node('span', '', label), node('strong', '', value));
    results.append(row);
  };

  results.innerHTML = '';
  if (activeEvent.id === 'eventA') {
    let mealCount = 0;
    let dessertCount = 0;    
    let merchBookAmount = 0;
    PRODUCTS.forEach(product => {
      const quantity = Number(cartQuantities[product.id]) || 0;
      if (product.category === '餐点') mealCount += quantity;
      if (product.category === '甜点' || product.category === '饮品') dessertCount += quantity;      
      if (product.category === '直购商品' || product.category === '可抱盒商品' || product.category === '随机商品') {
        merchBookAmount += (Number(product.price) || 0) * quantity;
      }
    });
    addRow('主餐特典（每个餐点 1 枚）', mealCount + ' 枚');
    addRow('杯垫特典（每个甜品 1 枚）', dessertCount + ' 枚');   
    addRow('满额特典（周边商品每 ¥500）', Math.floor(merchBookAmount / 500) + ' 枚');
    addRow('灯箱特典（周边商品满 ¥2,500）', merchBookAmount >= 2500 ? '1 枚' : '0 枚');
    const note = node('p', 'bonus-note', '灯箱特典达到门槛后仅计 1 枚，不累赠。');
    results.append(note);
    box.hidden = false;
  } else if (activeEvent.id === 'eventB') {
    let spending = 0;
    PRODUCTS.forEach(product => {
      spending += (Number(product.price) || 0) * (Number(cartQuantities[product.id]) || 0);
    });
    addRow('满额特典（每累计消费 ¥3,000）', Math.floor(spending / 3000) + ' 点');
    const note = node('p', 'bonus-note', '按购物清单内商品金额累计计算，不含附加费及其他费用。');
    results.append(note);
    box.hidden = false;
  } else {
    box.hidden = true;
  }
}

function calculate() {
  let items = 0;
  let fees = 0;

  PRODUCTS.forEach(product => {
    const quantity = cartQuantities[product.id] || 0;
    items += (Number(product.price) || 0) * quantity;
    fees += (Number(product.fee) || 0) * quantity;
  });

  const proxyValue = Math.max(0, Number($('proxyValue').value) || 0);
  const proxyPercent = Number($('proxyPercent').value) || 0;
  const proxyFee = proxyValue + items * proxyPercent / 100;
  const shipping = Math.max(0, Number($('shipping').value) || 0);
  const travel = Math.max(0, Number($('travel').value) || 0);
  const discount = Math.max(0, Number($('discount').value) || 0);
  const other = Math.max(0, Number($('other').value) || 0);
  const budget = Math.max(0, Number($('budget').value) || 0);
  const total = Math.max(
    0,
    items + fees + proxyFee + shipping + travel + other - discount
  );

  renderCart();

  $('subtotal').textContent = yen(items);
  $('fees').textContent = yen(fees);
  $('proxyOut').textContent = yen(proxyFee);
  $('shippingOut').textContent = yen(shipping);
  $('travelOut').textContent = yen(travel);
  $('discountOut').textContent = '−' + yen(discount);
  $('otherOut').textContent = yen(other);
  $('grandTotal').textContent = yen(total);
  renderBonuses();

  $('totalStatus').textContent = budget
    ? (total <= budget
      ? '预算剩余 ' + yen(budget - total)
      : '超出预算 ' + yen(total - budget))
    : '尚未设置预算';

  $('budgetFill').style.width = budget
    ? Math.min(100, total / budget * 100) + '%'
    : '0';
  $('budgetFill').style.background =
    budget && total > budget ? '#b42318' : '#087f5b';
  $('budgetStatus').textContent = budget
    ? '已使用 ' + Math.round(total / budget * 100) + '%（'
      + yen(total) + '／' + yen(budget) + '）'
    : '输入预算以查看使用比例';

  saveEventState();
}

function preparePrintDetails() {
  document.querySelectorAll('.sumrow').forEach(row => {
    const value = row.querySelector('strong')?.textContent.replace(/[\s,¥−-]/g, '') || '';
    row.classList.toggle('print-zero', /^0+(?:\.0+)?$/.test(value));
  });
}
function clearPrintDetails() {
  document.querySelectorAll('.sumrow.print-zero').forEach(row => row.classList.remove('print-zero'));
}
window.addEventListener('beforeprint', preparePrintDetails);
window.addEventListener('afterprint', clearPrintDetails);
$('print').onclick = () => {
  const previousView = $('viewCart').style.display === 'block' ? 'cart' : 'products';
  switchView('cart');
  preparePrintDetails();
  const restoreView = () => {
    clearPrintDetails();
    switchView(previousView);
    window.removeEventListener('afterprint', restoreView);
  };
  window.addEventListener('afterprint', restoreView);
  window.print();
};
