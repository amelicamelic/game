<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>购物计价工作台</title><style>
:root {
    --bg:#f4f6fa;
    --panel:#fff;
    --text:#1e293b;
    --muted:#64748b;
    --line:#e2e8f0;
    --accent:#3859c7;
    --accent2:#e8edff;
    --danger:#b42318;
    --good:#087f5b
}
* {
    box-sizing:border-box
}
body {
    margin:0;
    background:var(--bg);
    font:15px/1.5 system-ui,-apple-system,"Segoe UI","Noto Sans TC",sans-serif;
    color:var(--text)
}
.wrap {
    max-width:1440px;
    margin:auto;
    padding:28px 18px 50px
}
.head {
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:16px;
    margin-bottom:22px
}
.eyebrow {
    font-size:12px;
    letter-spacing:.12em;
    color:var(--muted);
    font-weight:700
}
.head h1 {
    margin:4px 0 0;
    font-size:clamp(24px,4vw,34px)
}
.head p {
    margin:5px 0 0;
    color:var(--muted)
}
.pill {
    border:1px solid var(--line);
    background:#fff;
    border-radius:999px;
    padding:8px 12px;
    font-size:12px;
    color:var(--muted);
    white-space:nowrap
}
.layout {
    display:grid;
    grid-template-columns:230px minmax(0,1fr) 380px;
    gap:18px;
    align-items:start
}
.eventnav {
    position:sticky;
    top:16px
}
.event-list {
    display:grid;
    gap:8px
}
.event-btn {
    display:block;
    width:100%;
    text-align:left;
    background:#fff;
    border:1px solid var(--line);
    color:var(--text);
    padding:12px;
    border-radius:12px
}
.event-btn.active {
    background:var(--accent2);
    border-color:#aebfff;
    color:var(--accent)
}
.event-btn strong {
    display:block;
    font-size:14px
}
.event-btn span {
    display:block;
    font-size:12px;
    color:var(--muted);
    margin-top:3px
}
.event-note {
    font-size:12px;
    color:var(--muted);
    margin:12px 0 0
}
.panel {
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:18px;
    padding:20px;
    box-shadow:0 4px 18px #0f172a08
}
.panel h2 {
    font-size:17px;
    margin:0 0 16px
}
.section-head {
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;
    margin-bottom:14px
}
.section-head h2 {
    margin:0
}
button {
    font:inherit;
    border:0;
    border-radius:10px;
    padding:10px 14px;
    cursor:pointer;
    font-weight:650
}
.primary {
    background:var(--accent);
    color:white
}
.soft {
    background:var(--accent2);
    color:var(--accent)
}
.ghost {
    background:#fff;
    border:1px solid var(--line);
    color:var(--text)
}
.small {
    font-size:13px;
    padding:7px 10px
}
.items {
    display: grid;
    gap: 12px;
}


.item {
    border:1px solid var(--line);
    border-radius:14px;
    padding:14px
}
.itemtop {
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:10px
}
.itemtitle {
    font-weight:700
}
.fields {
    display:grid;
    grid-template-columns:minmax(140px,1.5fr) minmax(90px,.8fr) minmax(80px,.65fr);
    gap:10px
}
.field {
    display:flex;
    flex-direction:column;
    gap:5px
}
.field label {
    font-size:12px;
    color:var(--muted)
}
input,textarea,select {
    width:100%;
    font:inherit;
    color:var(--text);
    border:1px solid #cbd5e1;
    border-radius:9px;
    background:white;
    padding:10px;
    min-width:0
}
.line-total {
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:12px;
    padding-top:10px;
    border-top:1px dashed var(--line);
    font-size:13px;
    color:var(--muted)
}
.line-total strong {
    font-size:16px;
    color:var(--text)
}
.summary {
    position:sticky;
    top:16px
}
.totalbox {
    background:linear-gradient(135deg,#eef2ff,#f8faff);
    border:1px solid #dbe4ff;
    border-radius:14px;
    padding:18px;
    margin-bottom:18px
}
.total-label {
    color:#53618a;
    font-size:13px
}
.total {
    font-size:clamp(28px,4vw,36px);
    font-weight:800;
    letter-spacing:-.03em;
    margin:3px 0 10px
}
.rows {
    display:grid;
    gap:10px
}
.sumrow {
    display:flex;
    justify-content:space-between;
    gap:12px;
    color:var(--muted);
    font-size:14px
}
.sumrow strong {
    color:var(--text);
    font-weight:650;
    font-variant-numeric:tabular-nums
}
.rule {
    height:1px;
    background:var(--line);
    margin:15px 0
}
.extras {
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px
}
.hint {
    font-size:12px;
    color:var(--muted);
    margin:14px 0 0
}
.bar {
    height:7px;
    background:#e2e8f0;
    border-radius:999px;
    overflow:hidden;
    margin:9px 0
}
.bar span {
    display:block;
    height:100%;
    width:0;
    background:var(--good)
}
.status {
    font-size:13px;
    color:var(--muted)
}
.status.over {
    color:var(--danger)
}
.product-demo {
    display:grid;
    grid-template-columns:88px minmax(0,1fr);
    gap:12px;
    align-items:center
}
.demo-img {
    width:88px;
    height:88px;
    border:1px solid var(--line);
    border-radius:12px;
    background:#f7f8fc;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden
}
.demo-img img {
    width:100%;
    height:100%;
    object-fit:contain
}
.demo-img svg {
    width:78px;
    height:78px
}
.demo-name {
    font-weight:750
}
.demo-price {
    font-size:18px;
    font-weight:800;
    margin-top:4px
}
.demo-meta {
    font-size:12px;
    color:var(--muted)
}
.demo-qty {
    display:flex;
    align-items:center;
    gap:8px;
    margin-top:9px
}
.demo-qty input {
    width:80px;
    padding:7px;
    text-align:center
}
.filter {
    display:flex;
    gap:8px;
    margin-bottom:14px;
    align-items:center
}
.filter input {
    flex:7 1 0;
    width:0;
    min-width:0
}
.filter select {
    flex:3 1 0;
    width:0;
    min-width:0
}
.productgrid {
    display:block
}
.category-group {
    margin: 0 0 20px;
}
.category-heading {
    display:flex;
    align-items:center;
    justify-content:center;
    gap:12px;
    margin: 30px 0 30px;
    color:#243247;
    font-size:18px;
    font-weight:800;
}
.category-heading::before,
.category-heading::after {
    content:"";
    height:1px;
    background:var(--line);
    flex:1;
}
.category-items {
    display:grid;
    grid-template-columns:repeat(4,minmax(0,1fr));
    gap:10px;
}
.productcard {
    border:1px solid var(--line);
    border-radius:12px;
    overflow:hidden
}
.productcard .art {
    height:112px;
    background:#f8f9fc;
    display:flex;
    align-items:center;
    justify-content:center
}
.productcard .art img {
    width:100%;
    height:100%;
    object-fit:contain
}
.productcard .art svg {
    width:95px;
    height:95px
}
.productcard .details {
    padding:10px
}
.productcard .details strong {
    display:block;
    font-size:13px;
    line-height:1.5
}
.productcard .details .product-name {
    margin:0
}
.productcard .details .product-unit-total {
    margin:0 0 8px;
    font-size:13px;
    line-height:1.5;
    font-weight:700;
    color:var(--text)
}
.productcard .details span {
    display:block;
    font-size:12px;
    color:var(--muted);
    margin-top:3px
}
.productcard .details input {
    margin-top:8px;
    padding:7px;
    text-align:center
}

.product-info-row {
    display:flex;
    align-items:center;
    gap:8px;
    margin-top:8px
}
.product-info-row input {
    flex:0 0 52px;
    width:52px;
    max-width:52px;
    margin-top:0;
    padding:6px 2px;
    text-align:center
}
.product-prices {
    flex:1 1 auto;
    min-width:0
}
.product-prices span {
    display:block;
    margin-top:3px
}

@media(max-width:1050px) {
    .layout {
    grid-template-columns:190px minmax(0,1fr)
}
.summary {
    grid-column:2;
    position:static
}
}
@media(max-width:800px) {
    .layout {
    grid-template-columns:1fr
}
.eventnav {
    position:static
}
.event-list {
    grid-template-columns:repeat(auto-fit,minmax(140px,1fr))
}
.summary {
    grid-column:auto
}
.summary {
    position:static
}
.head {
    align-items:flex-start;
    flex-direction:column
}
.fields {
    grid-template-columns:1fr 1fr
}
.fields .namefield {
    grid-column:1/-1
}
}
@media(max-width:520px) {
    .panel {
    padding:15px
}
.wrap {
    padding:18px 12px 35px
}
.extras {
    grid-template-columns:1fr 1fr
}
.category-items {
    grid-template-columns:repeat(2,minmax(0,1fr))
}
}
@media print {
    body {
    background:white
}
.wrap {
    max-width:none;
    padding:0
}
.layout {
    display:block
}
.panel {
    box-shadow:none;
    break-inside:avoid;
    margin-bottom:12px
}
.summary {
    position:static
}
}

.view-switch {
  display: flex;
  position: sticky;
  top: 8px;
  z-index: 5;
  gap: 8px;
  margin-bottom: 18px;
  padding: 4px;
  border-radius: 12px;
  background: var(--soft, #f1f5f9);
}
.view-tab {
  flex: 1;
  border: 0;
  border-radius: 9px;
  padding: 11px 14px;
  background: transparent;
  color: var(--muted, #64748b);
  font: inherit;
  font-weight: 700;
  cursor: pointer;
}
.view-tab.active {
  background: var(--surface, #fff);
  color: var(--text, #172033);
  box-shadow: 0 1px 4px rgba(15, 23, 42, .10);
}
#cartBadge {
  display: inline-flex;
  min-width: 22px;
  height: 22px;
  align-items: center;
  justify-content: center;
  margin-left: 5px;
  border-radius: 999px;
  background: #087f5b;
  color: #fff;
  font-size: 12px;
}
.cart-heading h2 { margin: 0 0 5px; }
.cart-heading p { margin: 0 0 16px; color: var(--muted, #64748b); }
.cart-items { display: grid; gap: 10px; }
.cart-row {
  display: grid;
  grid-template-columns: 64px minmax(0, 1fr) auto;
  align-items: center;
  gap: 12px;
  padding: 12px;
  border: 1px solid var(--line, #dce4f0);
  border-radius: 14px;
  background: var(--surface, #fff);
}
.cart-thumb {
  width: 64px;
  height: 64px;
  object-fit: cover;
  border-radius: 10px;
  background: #f1f5f9;
}
.cart-info { min-width: 0; display: grid; gap: 4px; }
.cart-name { font-weight: 700; overflow-wrap: anywhere; }
.cart-meta { color: var(--muted, #64748b); font-size: 13px; }
.cart-controls { display: flex; align-items: center; gap: 6px; margin-top: 4px; }
.cart-qty {
  width: 68px;
  padding: 5px 7px;
  border: 1px solid var(--line, #cbd5e1);
  border-radius: 8px;
  font: inherit;
}
.cart-price { text-align: right; font-weight: 800; white-space: nowrap; }
.cart-remove {
  border: 0;
  background: transparent;
  color: #b42318;
  cursor: pointer;
  padding: 4px;
  font: inherit;
  font-size: 13px;
}
.cart-empty { padding: 30px 12px; text-align: center; color: var(--muted, #64748b); }
@media (max-width: 620px) {
  .cart-row { grid-template-columns: 48px minmax(0, 1fr); }
  .cart-thumb { width: 48px; height: 48px; }
  .cart-price { grid-column: 2; text-align: left; }
}


[hidden] { display: none !important; }

.add-to-cart {
  width: 100%;
  margin-top: 8px;
  border: 0;
  border-radius: 9px;
  padding: 10px 12px;
  background: #087f5b;
  color: #fff;
  font: inherit;
  font-weight: 700;
  cursor: pointer;
}
.add-to-cart:hover { filter: brightness(.95); }

<body>
  <div class="wrap">
    <header class="head">
      <div>
        <div class="eyebrow">PERSONAL SHOPPING PLANNER</div>
        <h1>购物计价工作台</h1>
        <p>商品已预先列出，直接选择数量即可计价。</p>
      </div>
      <div class="pill">日元 JPY · 固定商品目录</div>
    </header>
    <main class="layout">
      <aside class="panel eventnav">
        <h2>活动目录</h2>
        <div class="event-list" id="eventList">
        </div>
        <p class="event-note">好烦啊能不能别办了==</p>
      </aside>
      <section class="panel">
        <div class="view-switch">
          <button type="button" id="showProducts" class="view-tab active">商品目录</button>
          <button type="button" id="showCart" class="view-tab">购物车 <span id="cartBadge">0</span></button>
        </div>
        <div id="viewProducts">
        <div class="section-head">
          <h2 id="eventTitle">商品清单</h2>
          <span class="status" id="productCount">
          </span>
        </div>
        <div class="filter">
          <input id="search" placeholder="搜索商品名称">
          <select id="category">
            <option value="">所有分类</option>
          </select>
        </div>
        <div class="productgrid" id="productGrid">
        </div>
        </div>
        <div id="viewCart" hidden>
          <div class="cart-heading">
            <h2>购物车</h2>
            <p>当前活动加入购物车的商品会显示在这里，可修改数量或移除。</p>
          </div>
          <div id="cartItems" class="cart-items"></div>
        </div>
      </section>
      <aside class="panel summary">
        <div class="totalbox">
          <div class="total-label">预计购物总额</div>
          <div class="total" id="grandTotal">¥0</div>
          <div class="status" id="totalStatus">尚未设置预算</div>
        </div>
        <h2>金额明细</h2>
        <div class="rows">
          <div class="sumrow">
            <span>商品总金额</span>
            <strong id="subtotal">¥0</strong>
          </div>
          <div class="sumrow">
            <span>服务费合计</span>
            <strong id="fees">¥0</strong>
          </div>
          <div class="sumrow">
            <span>代购费</span>
            <strong id="proxyOut">¥0</strong>
          </div>
          <div class="sumrow">
            <span>运费</span>
            <strong id="shippingOut">¥0</strong>
          </div>
          <div class="sumrow">
            <span>车马费</span>
            <strong id="travelOut">¥0</strong>
          </div>
          <div class="sumrow">
            <span>折扣</span>
            <strong id="discountOut">−¥0</strong>
          </div>
          <div class="sumrow">
            <span>其他费用</span>
            <strong id="otherOut">¥0</strong>
          </div>
        </div>
        <div class="rule">
        </div>
        <h2>预算设置</h2>
        <div class="field">
          <label for="budget">购物预算（日元）</label>
          <input id="budget" type="number" min="0" step="1" placeholder="例如 50000">
        </div>
        <div class="bar">
          <span id="budgetFill">
          </span>
        </div>
        <div class="status" id="budgetStatus">输入预算以查看使用比例</div>
        <div class="rule">
        </div>
        <h2>额外费用</h2>
        <div class="extras">
          <div class="field">
            <label for="proxyValue">代购费（金额）</label>
            <input id="proxyValue" type="number" min="0" step="1" value="0">
          </div>
          <div class="field">
            <label for="proxyPercent">代购费（比例）</label>
            <select id="proxyPercent">
              <option value="0">不按比例</option>
              <option value="1">1%</option>
              <option value="2">2%</option>
              <option value="3">3%</option>
              <option value="4">4%</option>
              <option value="5">5%</option>
              <option value="6">6%</option>
              <option value="7">7%</option>
              <option value="8">8%</option>
              <option value="9">9%</option>
              <option value="10">10%</option>
              <option value="11">11%</option>
              <option value="12">12%</option>
              <option value="13">13%</option>
              <option value="14">14%</option>
              <option value="15">15%</option>
              <option value="16">16%</option>
              <option value="17">17%</option>
              <option value="18">18%</option>
              <option value="19">19%</option>
              <option value="20">20%</option>
            </select>
          </div>
          <div class="field">
            <label for="travel">车马费</label>
            <input id="travel" type="number" min="0" step="1" value="0">
          </div>
          <div class="field">
            <label for="discount">折扣</label>
            <input id="discount" type="number" min="0" step="1" value="0">
          </div>
          <div class="field">
            <label for="shipping">运费</label>
            <input id="shipping" type="number" min="0" step="1" value="0">
          </div>
          <div class="field">
            <label for="other">其他费用</label>
            <input id="other" type="number" min="0" step="1" value="0">
          </div>
        </div>
        <div class="rule">
        </div>
        <button class="ghost" id="clear" style="width:100%">清空所有商品数量</button>
        <button class="soft" id="print" style="width:100%;margin-top:8px">打印／另存 PDF</button>
        <p class="hint">計算方式：商品單價 × 数量 + 單件服务费 × 数量，再加运费與其他费用、扣除折扣。</p>
      </aside>
    </main>
  </div><script>

const $=id=>document.getElementById(id), yen=n=>'¥'+Math.round(Number(n)||0).toLocaleString('ja-JP');

let activeEvent=EVENTS[0];

let PRODUCTS=activeEvent.products;

let cartQuantities = {};
let draftQuantities = {};

const eventStates={};

function stateFor(ev){if(!eventStates[ev.id])eventStates[ev.id]={cartQuantities:{},proxyValue:0,proxyPercent:0,shipping:0,travel:0,discount:0,other:0,budget:0};return eventStates[ev.id]}

function saveEventState(){const st=stateFor(activeEvent);st.cartQuantities={...cartQuantities};st.proxyValue=$('proxyValue').value;st.proxyPercent=$('proxyPercent').value;st.shipping=$('shipping').value;st.travel=$('travel').value;st.discount=$('discount').value;st.other=$('other').value;st.budget=$('budget').value}

function switchEvent(id){saveEventState();activeEvent=EVENTS.find(e=>e.id===id)||EVENTS[0];PRODUCTS=activeEvent.products;
const st=stateFor(activeEvent);cartQuantities=st.cartQuantities||{};draftQuantities={};PRODUCTS.forEach(p=>draftQuantities[p.id]=0);['proxyValue','proxyPercent','shipping','travel','discount','other','budget'].forEach(k=>$(k).value=st[k]??0);

$('search').value='';
$('category').innerHTML='<option value="">所有分类</option>';[...new Set(PRODUCTS.map(p=>p.category).filter(Boolean))].forEach(c=>{const o=node('option','',c);o.value=c;
$('category').append(o)});
renderEvents();
$('eventTitle').textContent=activeEvent.name+'｜商品清单';
render();
calculate()}

function renderEvents(){const host=
$('eventList');host.innerHTML='';EVENTS.forEach(ev=>{const b=node('button','event-btn'+(ev.id===activeEvent.id?' active':''));b.type='button';b.append(node('strong','',ev.name),node('span','',ev.description+' · '+ev.products.length+' 件'));b.onclick=()=>switchEvent(ev.id);host.append(b)})}

function node(tag,cls,text){const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n}

function artSvg(p){const palette=p.color||'#edf1ff';
let svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="${p.name} 示意图"><rect width="120" height="120" rx="16" fill="${palette}"/>`;if(p.category==="模型"){svg+='<ellipse cx="60" cy="95" rx="30" ry="7" fill="#000" opacity=".08"/><path d="M37 43 L29 23 L48 35 M83 43 L91 23 L72 35" fill="#fff" stroke="#8b83b8" stroke-width="3" stroke-linejoin="round"/><circle cx="60" cy="58" r="29" fill="#fff" stroke="#8b83b8" stroke-width="2"/><circle cx="49" cy="56" r="3" fill="#444"/><circle cx="71" cy="56" r="3" fill="#444"/><path d="M54 68 Q60 73 66 68" fill="none" stroke="#d78c9b" stroke-width="3" stroke-linecap="round"/><circle cx="45" cy="65" r="5" fill="#f2b8c7" opacity=".8"/><circle cx="75" cy="65" r="5" fill="#f2b8c7" opacity=".8"/>'}else if(p.category==="周边"&&p.name.includes("徽章")){svg+='<circle cx="60" cy="60" r="37" fill="#fff" stroke="#d4a78f" stroke-width="4"/><circle cx="60" cy="60" r="29" fill="#ffd9c8"/><path d="M60 38 L66 52 L81 53 L70 63 L73 78 L60 70 L47 78 L50 63 L39 53 L54 52Z" fill="#d8896a"/>'}else if(p.category==="周边"){svg+='<rect x="37" y="25" width="46" height="72" rx="5" fill="#fff" stroke="#78aa9e" stroke-width="3"/><circle cx="60" cy="48" r="13" fill="#bce6d9"/><path d="M45 78 Q60 56 75 78" fill="#8fcdbb"/><path d="M46 25 L60 14 L74 25" fill="none" stroke="#78aa9e" stroke-width="3"/>'}else if(p.category==="书籍"){svg+='<path d="M31 23 Q48 19 60 29 Q72 19 89 23 L89 93 Q72 89 60 99 Q48 89 31 93Z" fill="#fff" stroke="#c4a85c" stroke-width="3"/><path d="M60 29 L60 99" stroke="#c4a85c" stroke-width="2"/><circle cx="48" cy="52" r="8" fill="#f3d98a"/><path d="M70 45 H81 M70 54 H81 M70 63 H81" stroke="#c4a85c" stroke-width="3" stroke-linecap="round"/>'}else if(p.category==="玩偶"){svg+='<circle cx="60" cy="48" r="28" fill="#fff" stroke="#d4a0b7" stroke-width="3"/><circle cx="39" cy="29" r="12" fill="#fff" stroke="#d4a0b7" stroke-width="3"/><circle cx="81" cy="29" r="12" fill="#fff" stroke="#d4a0b7" stroke-width="3"/><circle cx="50" cy="47" r="3" fill="#555"/><circle cx="70" cy="47" r="3" fill="#555"/><ellipse cx="60" cy="57" rx="6" ry="4" fill="#e6a8c0"/><rect x="39" y="72" width="42" height="27" rx="13" fill="#fff" stroke="#d4a0b7" stroke-width="3"/>'}else{svg+='<path d="M35 48 L35 96 L85 96 L85 48 L75 48 L75 37 Q75 20 60 20 Q45 20 45 37 L45 48" fill="#fff" stroke="#8ba9d7" stroke-width="4" stroke-linejoin="round"/><path d="M49 39 Q49 28 60 28 Q71 28 71 39" fill="none" stroke="#8ba9d7" stroke-width="4"/><path d="M49 64 H71 M49 74 H71" stroke="#8ba9d7" stroke-width="3" stroke-linecap="round"/>'}return svg+'</svg>'}

function render() {
  const host = $('productGrid');
  const query = $('search').value.trim().toLowerCase();
  const category = $('category').value;
  host.innerHTML = '';

  const filtered = PRODUCTS.filter(product =>
    (!category || product.category === category) &&
    [product.name, product.category, product.id].join(' ').toLowerCase().includes(query)
  );

  $('productCount').textContent = filtered.length + ' 件商品';

  if (!filtered.length) {
    host.append(node('div', 'status', '没有符合的商品。'));
    return;
  }

  const groups = new Map();
  filtered.forEach(product => {
    const key = product.category || '其他';
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(product);
  });

  groups.forEach((products, categoryName) => {
    const group = node('section', 'category-group');
    group.append(node('h3', 'category-heading', categoryName));
    const grid = node('div', 'category-items');

    products.forEach(product => {
      const card = node('article', 'productcard');
      const art = node('div', 'art');

      if (product.image) {
        const image = node('img');
        image.src = product.image;
        image.alt = product.name;
        image.onerror = () => { art.innerHTML = artSvg(product); };
        art.append(image);
      } else {
        art.innerHTML = artSvg(product);
      }

      const details = node('div', 'details');
      const productName = node('strong', 'product-name', product.name);
      const productTotal = node('strong', 'product-unit-total', yen((Number(product.price) || 0) + (Number(product.fee) || 0)));
      details.append(productName, productTotal);

      const infoRow = node('div', 'product-info-row');
      const quantity = node('input');
      quantity.type = 'number';
      quantity.min = '0';
      quantity.step = '1';
      quantity.value = draftQuantities[product.id] ?? 0;
      quantity.setAttribute('aria-label', product.name + '购买数量');
      quantity.oninput = () => {
        draftQuantities[product.id] = Math.max(0, Math.floor(Number(quantity.value) || 0));
      };

      const prices = node('div', 'product-prices');
      prices.append(
        node('span', '', (product.priceLabel ?? '商品') + ' · ' + yen(product.price)),
        node('span', '', '服务费 ' + yen(product.fee || 0))
      );
      infoRow.append(quantity, prices);

      const addButton = node('button', 'add-to-cart', '加入购物车');
      addButton.type = 'button';
      addButton.onclick = () => {
        const quantityToAdd = Math.max(0, Math.floor(Number(draftQuantities[product.id]) || 0));
        if (quantityToAdd === 0) { quantity.focus(); return; }
        cartQuantities[product.id] = (cartQuantities[product.id] || 0) + quantityToAdd;
        saveEventState();
        renderCart();
        calculate();
        addButton.textContent = '已加入';
        window.setTimeout(() => { addButton.textContent = '加入购物车'; }, 900);
      };

      details.append(infoRow, addButton);
      card.append(art, details);
      grid.append(card);
    });

    group.append(grid);
    host.append(group);
  });
}

function renderCart() {
  const host = $('cartItems');
  if (!host) return;
  host.innerHTML = '';

  const chosen = PRODUCTS.filter(product => (cartQuantities[product.id] || 0) > 0);
  const count = chosen.reduce((sum, product) => sum + (cartQuantities[product.id] || 0), 0);
  $('cartBadge').textContent = count;

  if (chosen.length === 0) {
    host.innerHTML = '<div class="cart-empty">购物车还是空的。先到商品目录选择数量吧。</div>';
    return;
  }

  chosen.forEach(product => {
    const quantity = cartQuantities[product.id] || 0;
    const lineTotal = (Number(product.price) + Number(product.fee || 0)) * quantity;
    const row = document.createElement('div');
    row.className = 'cart-row';

    const thumb = document.createElement('img');
    thumb.className = 'cart-thumb';
    thumb.alt = product.name;
    if (product.image) thumb.src = product.image;
    else if (product.art) {
      thumb.src = 'data:image/svg+xml;charset=UTF-8,' + encodeURIComponent(product.art);
    }

    const info = document.createElement('div');
    info.className = 'cart-info';

    const name = document.createElement('div');
    name.className = 'cart-name';
    name.textContent = product.name;

    const meta = document.createElement('div');
    meta.className = 'cart-meta';
    meta.textContent = '单价 ' + yen(product.price) + ' · 单件服务费 ' + yen(product.fee || 0);

    const controls = document.createElement('div');
    controls.className = 'cart-controls';

    const qty = document.createElement('input');
    qty.className = 'cart-qty';
    qty.type = 'number';
    qty.min = '0';
    qty.step = '1';
    qty.value = quantity;
    qty.setAttribute('aria-label', product.name + '数量');
    qty.addEventListener('change', () => {
      const nextQuantity = Math.max(0, Math.floor(Number(qty.value) || 0));
      if (nextQuantity > 0) cartQuantities[product.id] = nextQuantity;
      else delete cartQuantities[product.id];
      saveEventState();
      renderCart();
      calculate();
      render();
    });

    const remove = document.createElement('button');
    remove.type = 'button';
    remove.className = 'cart-remove';
    remove.textContent = '移除';
    remove.addEventListener('click', () => {
      delete cartQuantities[product.id];
      saveEventState();
      renderCart();
      calculate();
      render();
    });

    controls.append(qty, remove);
    info.append(name, meta, controls);

    const price = document.createElement('div');
    price.className = 'cart-price';
    price.textContent = '商品费用 ' + yen(lineTotal);

    row.append(thumb, info, price);
    host.append(row);
  });
}

function switchView(view) {
  const cartVisible = view === 'cart';
  $('viewProducts').hidden = cartVisible;
  $('viewProducts').style.display = cartVisible ? 'none' : 'block';
  $('viewCart').hidden = !cartVisible;
  $('viewCart').style.display = cartVisible ? 'block' : 'none';
  $('showProducts').classList.toggle('active', !cartVisible);
  $('showCart').classList.toggle('active', cartVisible);
  if (cartVisible) renderCart();
}

function calculate() {
  let items = 0;
  let fees = 0;

  PRODUCTS.forEach(product => {
    const quantity = cartQuantities[product.id] || 0;
    items += (Number(product.price) || 0) * quantity;
    fees += (Number(product.fee) || 0) * quantity;
  });

  const proxyValue = Math.max(0, Number($('proxyValue').value) || 0);
  const proxyPercent = Number($('proxyPercent').value) || 0;
  const proxyFee = proxyValue + items * proxyPercent / 100;
  const shipping = Math.max(0, Number($('shipping').value) || 0);
  const travel = Math.max(0, Number($('travel').value) || 0);
  const discount = Math.max(0, Number($('discount').value) || 0);
  const other = Math.max(0, Number($('other').value) || 0);
  const budget = Math.max(0, Number($('budget').value) || 0);
  const total = Math.max(
    0,
    items + fees + proxyFee + shipping + travel + other - discount
  );

  renderCart();

  $('subtotal').textContent = yen(items);
  $('fees').textContent = yen(fees);
  $('proxyOut').textContent = yen(proxyFee);
  $('shippingOut').textContent = yen(shipping);
  $('travelOut').textContent = yen(travel);
  $('discountOut').textContent = '−' + yen(discount);
  $('otherOut').textContent = yen(other);
  $('grandTotal').textContent = yen(total);

  $('totalStatus').textContent = budget
    ? (total <= budget
      ? '预算剩余 ' + yen(budget - total)
      : '超出预算 ' + yen(total - budget))
    : '尚未设置预算';

  $('budgetFill').style.width = budget
    ? Math.min(100, total / budget * 100) + '%'
    : '0';
  $('budgetFill').style.background =
    budget && total > budget ? '#b42318' : '#087f5b';
  $('budgetStatus').textContent = budget
    ? '已使用 ' + Math.round(total / budget * 100) + '%（'
      + yen(total) + '／' + yen(budget) + '）'
    : '输入预算以查看使用比例';

  saveEventState();
}

$('showProducts').addEventListener('click', () => switchView('products'));
$('showCart').addEventListener('click', () => switchView('cart'));
switchView('products');
$('search').oninput = render;
$('category').onchange = render;
$('proxyPercent').onchange = calculate;
['proxyValue', 'shipping', 'travel', 'discount', 'other', 'budget'].forEach(id => { $(id).oninput = calculate; });
$('clear').onclick = () => { cartQuantities = {}; saveEventState(); render(); renderCart(); calculate(); };
$('print').onclick=()=>window.print();

renderEvents();
$('eventTitle').textContent=activeEvent.name+'｜商品清单';
const cats=[...new Set(PRODUCTS.map(p=>p.category).filter(Boolean))];cats.forEach(c=>{const o=node('option','',c);o.value=c;
$('category').append(o)});
render();
calculate();
